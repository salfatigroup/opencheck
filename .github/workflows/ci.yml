name: PR Tests

on:
  pull_request:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Verify CLI --help
        run: bun run src/cli.ts --help

      - name: Verify CLI --version
        run: bun run src/cli.ts --version

      - name: Verify CLI --validate with valid configs
        run: |
          bun run src/cli.ts --config tests/fixtures/minimal-config.yaml --validate
          bun run src/cli.ts --config tests/fixtures/valid-config.yaml --validate

      - name: Verify CLI rejects invalid input
        run: |
          set +e
          bun run src/cli.ts --config nonexistent.yaml 2>&1
          [ $? -ne 0 ] || { echo "Expected non-zero exit for missing config"; exit 1; }
          bun run src/cli.ts --config tests/fixtures/invalid-config.yaml 2>&1
          [ $? -ne 0 ] || { echo "Expected non-zero exit for invalid config"; exit 1; }
