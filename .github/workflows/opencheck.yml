name: OpenCheck

on:
  workflow_call:
    inputs:
      config:
        description: "Path to tests.yaml config file"
        required: false
        type: string
        default: "tests.yaml"
      working-directory:
        description: "Working directory for running OpenCheck"
        required: false
        type: string
        default: "."
      bun-version:
        description: "Bun version to use"
        required: false
        type: string
        default: "latest"
      artifact-retention-days:
        description: "Number of days to retain recording artifacts"
        required: false
        type: number
        default: 30

permissions:
  contents: read
  pull-requests: write

jobs:
  opencheck:
    name: Run OpenCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Run OpenCheck
        id: opencheck
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set +e
          bunx opencheck --config "${{ inputs.config }}" > /tmp/opencheck-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/opencheck-output.txt

      - name: Upload test recordings
        id: upload-recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencheck-recordings
          path: ${{ inputs.working-directory }}/.opencheck-recordings/
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Write test summary
        if: always()
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          exit_code="${{ steps.opencheck.outputs.exit_code }}"
          if [ "$exit_code" = "0" ]; then
            echo "## ✅ OpenCheck Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All tests passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ OpenCheck Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Some tests failed." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Full output</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/opencheck-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

          has_screenshots=false
          for dir in .opencheck-recordings/*/; do
            [ -d "$dir" ] || continue
            if [ -f "$dir/before.png" ] || [ -f "$dir/after.png" ]; then
              has_screenshots=true
              break
            fi
          done

          if [ "$has_screenshots" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 📸 Failure Screenshots" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Before/after screenshots for failed tests are available in the **opencheck-recordings** artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Test | Screenshots |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|------------|" >> "$GITHUB_STEP_SUMMARY"
            for dir in .opencheck-recordings/*/; do
              [ -d "$dir" ] || continue
              if [ -f "$dir/before.png" ] || [ -f "$dir/after.png" ]; then
                test_name=$(basename "$dir")
                files=""
                [ -f "$dir/before.png" ] && files="before.png"
                [ -f "$dir/after.png" ] && files="${files:+$files, }after.png"
                echo "| \`$test_name\` | $files |" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 📥 Download the **opencheck-recordings** artifact from the artifacts section above to view screenshots." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on PR
        if: always() && github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/opencheck-output.txt', 'utf8');
            const exitCode = '${{ steps.opencheck.outputs.exit_code }}';
            const passed = exitCode === '0';
            const icon = passed ? '✅' : '❌';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body = `<!-- opencheck-results -->\n`;
            body += `## ${icon} OpenCheck Results\n\n`;
            body += '```\n' + output + '\n```\n';

            if (!passed) {
              body += `\n> 📹 Download recordings from [Actions run summary](${runUrl}) → **opencheck-recordings** artifact\n`;
            }
            body += `\n> View traces: drag \`trace.zip\` into [trace.playwright.dev](https://trace.playwright.dev)\n`;

            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const marker = '<!-- opencheck-results -->';
            const existing = comments.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Exit with test result
        if: always()
        shell: bash
        run: exit ${{ steps.opencheck.outputs.exit_code }}
